[tools]
lua-language-server = "latest"
stylua = "latest"
rumdl = "latest"
tree-sitter = "latest"
"npm:@wc-toolkit/language-server" = "latest"
bun = "latest"
go = "latest"
node = "lts"
python = "3.15.2"
rust = "latest"
uv = "latest"


"npm:@olrtg/emmet-language-server" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:@bitwarden/cli" = "latest"
"pipx:basedpyright" = "latest"
"pipx:headroom-ai" = { version = "latest", extras = "all", uvx_args = "--python 3.13" }
cargo-binstall = "latest"
"pipx:ruff" = "latest"
lazygit = "latest"
lazydocker = "latest"
"go:golang.org/x/tools/gopls" = "0.24.0"
opencode = "latest"
"cargo:zoxide" = "latest"

[settings]
# Supply-chain cooldown: `latest` resolves only to releases at least 7 days old (npm/pipx deps included).
minimum_release_age = "7d"

[settings.npm]
package_manager = "npm"
